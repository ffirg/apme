---
# Playbook with Ansible 2.9 patterns that need modernization for 2.20+
- name: Deploy web application
  hosts: webservers
  become: yes
  gather_facts: yes

  vars:
    app_port: 8080
    db_password: "{{ lookup('env', 'DB_PASS') }}"

  tasks:
    - include: tasks/prereqs.yml

    - name: Install packages
      yum:
        name: "{{ item }}"
        state: present
      with_items:
        - httpd
        - mod_ssl
        - python2-pip

    - name: Copy config with permissions
      copy:
        src: app.conf
        dest: /etc/httpd/conf.d/app.conf
        owner: root
        group: root
        mode: 0644
      notify: restart httpd

  roles:
    - webserver
    - database

  handlers:
    - name: restart httpd
      service:
        name: httpd
        state: restarted
